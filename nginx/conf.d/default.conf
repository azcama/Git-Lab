# --- DEFAULT BLOCK ---
# This server block acts as a "catch-all" for undefined domains.
# If a request doesn't match any known server_name, it falls here
server {
    listen 80 default_server;
    server_name _;
    return 444; 
}

# Define the second server block for app1.test domain
server {

    listen 80;

    server_name app1.test;

    location / {
        # Proxy pass requests to the app1 backend service
        proxy_pass http://app1/; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Define the admin subdirectory location block (requires authentication)
    location /admin/ {
        
        auth_basic "Restricted Access - Administrator Only";        
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://app2/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}